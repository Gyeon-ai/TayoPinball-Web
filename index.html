<h1 class=sr-only>타요 핀볼 - 랜덤 추첨기</h1>
<div id=settings class=settings>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings>
      <span data-trans>Settings</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <select id=sltMap aria-label=맵></select>
      </div>
      <div class=row>
        <div class=btn-group aria-label="당첨 순위">
          <button class="active btn-first-winner btn-winner" data-trans>First</button>
          <button class="btn-last-winner btn-winner" data-trans>Last</button>
          <input type=number id=in_winningRank value=1 min=1>
        </div>
      </div>
      <div class="actions setup-actions">
        <button id=btnShuffle>
          <i class="icon shuffle"></i>
          <span data-trans>Shuffle</span>
        </button>
        <button id=btnStart>
          <i class="icon play"></i>
          <span data-trans>Start</span>
        </button>
      </div>
      <div class="row speed-row">
        <div class="btn-group speed-group" aria-label=배속>
          <button type=button class="active btn-speed" data-speed=1>1x</button>
          <button type=button class=btn-speed data-speed=2>2x</button>
          <button type=button class=btn-speed data-speed=5>5x</button>
        </div>
      </div>
    </div>
  </div>
  <div class=left>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>타요,종겜,핀볼</textarea>
  </div>
</div>
<div id=resultTimerOverlay class="hidden result-timer-overlay" role=dialog aria-label="타이머 설정">
  <div class=result-timer-setup>
    <strong>타이머 설정</strong>
    <div class=result-timer-controls>
      <input type=number id=in_resultTimerMinutes value=0 min=0 max=999 step=1 aria-label="타이머 분">
      <span>분</span>
      <input type=number id=in_resultTimerSeconds value=0 min=0 max=59 step=1 aria-label="타이머 초">
      <span>초</span>
      <button type=button id=btnResultTimerStart>시작</button>
    </div>
  </div>
  <div class=result-timer-running aria-live=polite>
    <span>남은 시간</span>
    <strong id=resultTimerDisplay>00:00</strong>
    <div class=result-timer-actions>
      <button type=button id=btnResultTimerPause aria-pressed=false>일시정지</button>
      <button type=button id=btnResultTimerReset>리셋</button>
    </div>
  </div>
</div>
